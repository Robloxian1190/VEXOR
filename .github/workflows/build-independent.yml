name: Build independent VEXOR

on:
  workflow_dispatch:
  push:
    branches: [ vexor-independent ]
    paths:
      - "independent/**"
      - ".github/workflows/build-independent.yml"

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Publish standalone Windows application
        shell: pwsh
        run: dotnet publish independent/Vexor.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -o independent/publish
      - name: Verify VEXOR.exe
        shell: pwsh
        run: |
          if (!(Test-Path "independent/publish/VEXOR.exe")) { throw "VEXOR.exe missing" }
      - uses: actions/upload-artifact@v4
        with:
          name: VEXOR-Independent-Windows
          path: independent/publish/
          if-no-files-found: error
