name: Build VEXOR for Windows

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "vexor/**"
      - ".github/workflows/build-vexor.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout VEXOR build files
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Get upstream Roblox Account Manager 3.7.2
        shell: pwsh
        run: |
          git clone --depth 1 --branch 3.7.2 https://github.com/ic3w0lf22/Roblox-Account-Manager.git upstream

      - name: Apply VEXOR changes
        shell: pwsh
        run: |
          $project = "upstream/RBX Alt Manager/RBX Alt Manager.csproj"
          $manager = "upstream/RBX Alt Manager/AccountManager.cs"
          Copy-Item "vexor/VexorDashboard.cs" "upstream/RBX Alt Manager/VexorDashboard.cs" -Force

          $p = Get-Content $project -Raw
          if ($p -notmatch 'VexorDashboard.cs') {
            $p = $p -replace '<Compile Include="AccountManager.cs">', ('<Compile Include="VexorDashboard.cs" />' + [Environment]::NewLine + '    <Compile Include="AccountManager.cs">')
          }
          $p = $p -replace '<AssemblyName>Roblox Account Manager</AssemblyName>', '<AssemblyName>VEXOR</AssemblyName>'
          Set-Content $project $p -Encoding UTF8

          # Own executable metadata, without misrepresenting the upstream license.
          $assemblyInfo = "upstream/RBX Alt Manager/Properties/AssemblyInfo.cs"
          $meta = Get-Content $assemblyInfo -Raw
          $meta = $meta.Replace('AssemblyTitle("Roblox Account Manager")', 'AssemblyTitle("VEXOR")')
          $meta = $meta.Replace('AssemblyProduct("Roblox Account Manager")', 'AssemblyProduct("VEXOR Account Studio")')
          $meta = $meta.Replace('AssemblyDescription("Created by ic3w0lf")', 'AssemblyDescription("VEXOR account studio; based on Roblox Account Manager by ic3w0lf")')
          $meta = $meta.Replace('AssemblyCompany("ic3")', 'AssemblyCompany("VEXOR")')
          Set-Content $assemblyInfo $meta -Encoding UTF8

          $m = Get-Content $manager -Raw
          if ($m -notmatch 'InitializeVexorDashboard\(\);') {
            $m = $m -replace 'this\.Rescale\(\);', ('this.Rescale();' + [Environment]::NewLine + '            InitializeVexorDashboard();')
          }
          # For first launch, initialize the existing Windows-protected default storage
          # without displaying the encryption-choice overlay. Existing account files
          # still go through LoadAccounts() and retain any password protection.
          $oldFirstRun = 'else' + [Environment]::NewLine + '                ResetEncryption();'
          $newFirstRun = 'else' + [Environment]::NewLine + '                DefaultEncryptionButton.PerformClick();'
          if (!$m.Contains($oldFirstRun)) { throw "Could not find first-run encryption branch" }
          $m = $m.Replace($oldFirstRun, $newFirstRun)

          # This fork uses GitHub downloads, not the upstream in-app updater.
          # Force this off even if an older RAMSettings.ini enabled it.
          $m = $m.Replace('if (General.Get<bool>("CheckForUpdates"))', 'if (false /* VEXOR updates are delivered via GitHub Actions */)')
          Set-Content $manager $m -Encoding UTF8

          # VEXOR has its own process identity. The upstream app's global mutex
          # would otherwise block either application while the other is running.
          $program = "upstream/RBX Alt Manager/Classes/Program.cs"
          $entry = Get-Content $program -Raw
          $upstreamMutex = '{93b3858f-3dac-4dc0-99cb-0476efc5adce}'
          if (!$entry.Contains($upstreamMutex)) { throw "Upstream single-instance mutex not found" }
          $entry = $entry.Replace($upstreamMutex, '{7f9d12cb-5a63-4e5f-b9aa-38d120ac7721}')
          $entry = $entry.Replace('Roblox Account Manager is already running!', 'VEXOR is already running!')
          # The upstream optional cookie-file workaround keeps an exclusive
          # file handle open for the lifetime of the app. Do not lock Roblox's
          # shared cookie file from VEXOR; that prevents coexistence.
          $entry = $entry.Replace('bool Apply773Fix = !(string.IsNullOrEmpty(CookiesFile) || !File.Exists(CookiesFile) || File.Exists(Path.Combine(Environment.CurrentDirectory, "no773fix.txt")));',
            'bool Apply773Fix = false; // VEXOR: do not hold a cross-app exclusive cookie lock')
          if ($entry -notmatch 'bool Apply773Fix = false;') { throw "Could not disable exclusive cookie-file lock" }
          # Store relative account data in VEXOR's own extracted folder.
          # Launching from shortcuts or other working directories remains safe.
          $entry = $entry.Replace('int Stupid = 1337;', 'int Stupid = 1337;' + [Environment]::NewLine +
            '            Directory.SetCurrentDirectory(AppDomain.CurrentDomain.BaseDirectory);')
          Set-Content $program $entry -Encoding UTF8

          $packages = "upstream/RBX Alt Manager/packages.config"
          $pkg = Get-Content $packages -Raw
          if ($pkg -notmatch 'id="CefSharp.Common"') {
            $pkg = $pkg -replace '<packages>', ('<packages>' + [Environment]::NewLine + '  <package id="CefSharp.Common" version="109.1.110" targetFramework="net472" />')
            Set-Content $packages $pkg -Encoding UTF8
          }

      - name: Restore packages
        shell: pwsh
        run: |
          cd upstream
          nuget restore "RBX Alt Manager.sln" -NonInteractive
          if (!(Test-Path "packages/CefSharp.Common.109.1.110")) {
            nuget install CefSharp.Common -Version 109.1.110 -OutputDirectory packages -NonInteractive
          }

      - name: Build Release
        shell: pwsh
        run: |
          cd upstream
          msbuild "RBX Alt Manager.sln" /m /p:Configuration=Release /p:Platform="Any CPU"

      - name: Verify VEXOR executable
        shell: pwsh
        run: |
          if (!(Test-Path "upstream/build/Release/VEXOR.exe")) {
            throw "VEXOR.exe was not produced."
          }
          Copy-Item "upstream/LICENSE" "upstream/build/Release/LICENSE.txt" -Force
          # The new interface uses real controls, not the old screenshot.\n          # Preserve the upstream GPL license and required runtime files.

      - name: Upload VEXOR Windows download
        uses: actions/upload-artifact@v4
        with:
          name: VEXOR-Windows
          path: upstream/build/Release/
          if-no-files-found: error
          compression-level: 6
